services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tws_marketplace
      POSTGRES_USER: tws
      POSTGRES_PASSWORD: tws_local_password
    ports:
      - "5432:5432"
    volumes:
      - tws_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tws -d tws_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tws_postgres_data:

